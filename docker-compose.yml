services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: menuza
      POSTGRES_USER: menuza
      POSTGRES_PASSWORD: menuza
    ports:
      - "5432:5432"
    volumes:
      - menuza_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  menuza_postgres:
