services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanmenu
      POSTGRES_USER: scanmenu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - scanmenu_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  auth-service:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/auth-service"
    command: npm run start -w @scanmenu/auth-service
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 4101
      DATABASE_URL: postgresql://scanmenu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/scanmenu
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Scan Menu <noreply@your-domain.com>}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://scanmenu.your-ma.com}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.scanmenu.your-ma.com}
    depends_on:
      - postgres
      - redis

  restaurant-service:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/restaurant-service"
    command: npm run start -w @scanmenu/restaurant-service
    environment:
      NODE_ENV: production
      RESTAURANT_SERVICE_PORT: 4102
      DATABASE_URL: postgresql://scanmenu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/scanmenu
      TRANSLATION_SERVICE_URL: http://translation-service:4104
    depends_on:
      - postgres
      - translation-service

  order-service:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/order-service"
    command: npm run start -w @scanmenu/order-service
    environment:
      NODE_ENV: production
      ORDER_SERVICE_PORT: 4103
      DATABASE_URL: postgresql://scanmenu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/scanmenu
      TRANSLATION_SERVICE_URL: http://translation-service:4104
      RESTAURANT_SERVICE_URL: http://restaurant-service:4102
    depends_on:
      - postgres
      - translation-service

  translation-service:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/translation-service"
    command: npm run start -w @scanmenu/translation-service
    environment:
      NODE_ENV: production
      TRANSLATION_SERVICE_PORT: 4104

  api-gateway:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/api-gateway"
    command: npm run start -w @scanmenu/api-gateway
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      RESTAURANT_SERVICE_URL: http://restaurant-service:4102
      ORDER_SERVICE_URL: http://order-service:4103
      TRANSLATION_SERVICE_URL: http://translation-service:4104
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - translation-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scanmenu-api.rule=Host(`api.scanmenu.your-ma.com`)"
      - "traefik.http.routers.scanmenu-api.entrypoints=websecure"
      - "traefik.http.routers.scanmenu-api.tls=true"
      - "traefik.http.services.scanmenu-api.loadbalancer.server.port=4000"

  web:
    build:
      context: .
      args:
        SERVICE_WORKSPACE: "@scanmenu/web"
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.scanmenu.your-ma.com}
        WEB_PUBLIC_API_URL: http://api-gateway:4000
    command: npm run start -w @scanmenu/web
    environment:
      NODE_ENV: production
      WEB_PUBLIC_API_URL: http://api-gateway:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.scanmenu.your-ma.com}
    depends_on:
      - api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.scanmenu-web.rule=Host(`scanmenu.your-ma.com`)"
      - "traefik.http.routers.scanmenu-web.entrypoints=websecure"
      - "traefik.http.routers.scanmenu-web.tls=true"
      - "traefik.http.services.scanmenu-web.loadbalancer.server.port=3000"

volumes:
  scanmenu_postgres:
