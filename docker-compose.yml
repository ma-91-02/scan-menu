services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: babili
      POSTGRES_USER: babili
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - babili_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babili -d babili"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine

  auth-service:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    command: npm run start -w @babili/auth-service
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 4101
      DATABASE_URL: postgresql://babili:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/babili
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: redis://redis:6379
      RESTAURANT_SERVICE_URL: http://restaurant-service:4102
      ORDER_SERVICE_URL: http://order-service:4103
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Babili <noreply@your-ma.com>}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-${SERVICE_URL_WEB:-https://admin.babili.your-ma.com}}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-${SERVICE_URL_API_GATEWAY:-https://api.babili.your-ma.com}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  restaurant-service:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    command: npm run start -w @babili/restaurant-service
    environment:
      NODE_ENV: production
      RESTAURANT_SERVICE_PORT: 4102
      DATABASE_URL: postgresql://babili:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/babili
      TRANSLATION_SERVICE_URL: http://translation-service:4104
    depends_on:
      postgres:
        condition: service_healthy
      translation-service:
        condition: service_started

  order-service:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    command: npm run start -w @babili/order-service
    environment:
      NODE_ENV: production
      ORDER_SERVICE_PORT: 4103
      DATABASE_URL: postgresql://babili:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/babili
      TRANSLATION_SERVICE_URL: http://translation-service:4104
      RESTAURANT_SERVICE_URL: http://restaurant-service:4102
    depends_on:
      postgres:
        condition: service_healthy
      translation-service:
        condition: service_started

  translation-service:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    command: npm run start -w @babili/translation-service
    environment:
      NODE_ENV: production
      TRANSLATION_SERVICE_PORT: 4104

  api-gateway:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_API_GATEWAY:-https://api.babili.your-ma.com}}
        WEB_PUBLIC_API_URL: http://api-gateway:4000
    command: npm run start -w @babili/api-gateway
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      AUTH_SERVICE_URL: http://auth-service:4101
      RESTAURANT_SERVICE_URL: http://restaurant-service:4102
      ORDER_SERVICE_URL: http://order-service:4103
      TRANSLATION_SERVICE_URL: http://translation-service:4104
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - translation-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.babili-api.rule=Host(`api.babili.your-ma.com`)"
      - "traefik.http.routers.babili-api.entrypoints=websecure"
      - "traefik.http.routers.babili-api.tls=true"
      - "traefik.http.services.babili-api.loadbalancer.server.port=4000"

  web:
    image: babili-app:${COOLIFY_RESOURCE_UUID:-local}
    command: npm run start -w @babili/web
    environment:
      NODE_ENV: production
      WEB_PUBLIC_API_URL: http://api-gateway:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${SERVICE_URL_API_GATEWAY:-https://api.babili.your-ma.com}}
    depends_on:
      - api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.babili-web.rule=Host(`admin.babili.your-ma.com`) || Host(`restaurant.babili.your-ma.com`) || Host(`staff.babili.your-ma.com`) || Host(`customer.babili.your-ma.com`)"
      - "traefik.http.routers.babili-web.entrypoints=websecure"
      - "traefik.http.routers.babili-web.tls=true"
      - "traefik.http.services.babili-web.loadbalancer.server.port=3000"

volumes:
  babili_postgres:
